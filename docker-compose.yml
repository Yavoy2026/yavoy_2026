# Локальная разработка: только инфраструктура, бэкенд запускается через `pnpm dev`
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: yavoy
      POSTGRES_PASSWORD: yavoy
      POSTGRES_DB: yavoy
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yavoy"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
