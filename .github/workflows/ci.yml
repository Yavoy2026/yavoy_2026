name: CI

on:
  push:
    branches: [main, backend-mvp]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yavoy
          POSTGRES_PASSWORD: yavoy
          POSTGRES_DB: yavoy
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U yavoy"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @yavoy/backend exec drizzle-kit check
        name: Проверка консистентности миграций
      - run: pnpm test
        env:
          DATABASE_URL: postgres://yavoy:yavoy@localhost:5433/yavoy
      - run: pnpm build
